; Odczyt PHP WWW OVH Performance, klaster 131, 27.10.2026.
memory_limit = 512M
max_execution_time = 165
max_input_time = -1
max_input_vars = 16000
default_socket_timeout = 60
allow_url_fopen = On
session.upload_progress.enabled = Off
session.serialize_handler = php
opcache.enable = On
opcache.validate_timestamps = On
opcache.revalidate_freq = 2
date.timezone = Europe/Paris
realpath_cache_size = 2M

; Lokalnie logujemy błędy, bez wyświetlania ich odwiedzającym.
display_errors = Off
log_errors = On
; Transport poczty z PHP wyłączony; MU-guard zabezpiecza również WordPressa.
sendmail_path = /bin/false
